<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neutral Rates Dashboard</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <!-- Chart Zoom -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js" defer></script>

  <!-- CSS -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Main JS -->
  <script type="module" src="js/main.js" defer></script>
</head>
<body>

<h2>Neutral Rates Dashboard</h2>

<!-- 🔹 Tab buttons -->
<div class="tabs">
  <button data-tab="economic" class="tab-button active">Economic Data</button>
  <button data-tab="parameters" class="tab-button">Country Parameters</button>
  <button data-tab="interest" class="tab-button">Interest Rates</button>
</div>

<!-- 🔹 Tab contents -->

<!-- 1️⃣ Economic Data Tab -->
<div id="tab-economic" class="tab-content">
  <div class="controls">
    <label>Countries:</label><br>
    <select id="countrySelect" multiple size="3"></select>

    <label>Variables:</label><br>
    <select id="variableSelect" multiple size="3"></select>

    <div class="buttons">
      <button id="downloadPNG">Download PNG</button>
      <button id="exportCSV">Export CSV</button>
      <button id="resetZoom">Reset Zoom</button>
    </div>
  </div>

  <canvas id="myChart" height="300"></canvas>
</div>

<!-- 2️⃣ Country Parameters Tab -->
<div id="tab-parameters" class="tab-content" style="display:none;">
  <table id="parametersTable" border="1">
    <thead>
      <tr>
        <th>Country</th>
        <th>Parameter A</th>
        <th>Parameter B</th>
        <th>Parameter C</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows filled by JS -->
    </tbody>
  </table>
</div>

<!-- 3️⃣ Interest Rates Tab -->
<div id="tab-interest" class="tab-content" style="display:none;">
  <canvas id="interestChart" height="300"></canvas>
</div>

</body>
</html>
